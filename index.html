<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 가능충 케이크 메이커</title>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue, remove }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ✅ Firebase 설정 */
const firebaseConfig = {
  apiKey: "너꺼",
  authDomain: "너꺼",
  projectId: "너꺼",
  storageBucket: "너꺼",
  messagingSenderId: "너꺼",
  appId: "너꺼"
};

/* ✅ 초기화 (딱 1번만!) */
try {
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  window._fb = { db, ref, set, push, onValue, remove };
  window.dispatchEvent(new Event('firebase-ready'));
} catch(e) {
  console.error(e);
  window.dispatchEvent(new Event('firebase-error'));
}
</script>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #fff8f0;
}
button {
  padding: 10px 20px;
  margin: 10px;
}
</style>
</head>

<body>

<h1>🎂 가능충 케이크</h1>

<input id="nick" placeholder="닉네임">
<br><br>

<button onclick="createRoom()">방 만들기</button>
<br><br>

<input id="roomCode" placeholder="방 코드">
<button onclick="joinRoom()">입장</button>

<script>
let db, ref, set, push, onValue, remove;
let ready = false;

window.addEventListener('firebase-ready', () => {
  const fb = window._fb;
  db = fb.db;
  ref = fb.ref;
  set = fb.set;
  push = fb.push;
  onValue = fb.onValue;
  remove = fb.remove;
  ready = true;
  console.log("🔥 Firebase 연결 성공");
});

function createRoom() {
  if (!ready) return alert("Firebase 아직 준비 안됨");

  const nick = document.getElementById("nick").value;
  if (!nick) return alert("닉네임 입력");

  const room = Math.random().toString(36).slice(2,8).toUpperCase();

  set(ref(db, "rooms/" + room), {
    host: nick
  });

  alert("방 생성됨: " + room);
}

function joinRoom() {
  const room = document.getElementById("roomCode").value;
  if (!room) return alert("코드 입력");

  alert("입장 시도: " + room);
}
</script>

</body>
</html>
